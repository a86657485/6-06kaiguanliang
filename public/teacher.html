<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第6课 · 班级学习数据大屏</title><link rel="stylesheet" href="/style.css?v=1"><link rel="stylesheet" href="/teacher-dash.css?v=5"><script src="/rules.js?v=5" defer></script><script type="module" src="/teacher.mjs?v=6"></script></head><body class="dash-body">
<header class="dash-head">
  <div class="dash-brand"><b>校园开关站 · 学习证据大屏</b><small>第6课《开关量的真与假》 · 免密码，仅教师设备</small></div>
  <label class="dash-class">班级<select id="teacher-class"></select></label>
  <p id="class-status" class="dash-status" role="status">加载中…</p>
  <div class="dash-actions"><a id="demo-toggle" class="dash-btn" href="/teacher?demo=1">看演示数据</a><button id="class-export" class="dash-btn">导出班级记录</button><button id="new-round" class="dash-btn">开启本班新轮次</button><a href="/test" class="dash-btn teacher-test-link">进入教师测试模式 ↗</a></div>
</header>
<p id="demo-banner" class="demo-banner" hidden>演示模式：以下为虚构班级数据，仅供预览图表，不是任何真实学生的记录。<a href="/teacher">回到真实班级</a></p>
<main id="dashboard" class="dash-main">
  <section id="summary" class="kpis" aria-label="关键数字"></section>
  <section id="class-charts" class="dash-grid" aria-label="当前班级学习图表">
    <article id="c-target" class="dash-card wide"></article>
    <article id="c-progress" class="dash-card"></article>
    <article id="c-mastery" class="dash-card"></article>
    <article id="c-mis" class="dash-card"></article>
    <article id="c-pred" class="dash-card"></article>
    <article id="c-hint" class="dash-card"></article>
    <article id="c-quiz" class="dash-card"></article>
    <article id="c-timeline" class="dash-card"></article>
    <article id="c-not" class="dash-card"></article>
    <article id="c-counter" class="dash-card"></article>
  </section>
  <section id="diagnosis" class="dash-panel"></section>
  <section class="dash-panel">
    <div class="dash-tools"><h2>学生明细</h2><input id="teacher-search" aria-label="查找姓名" placeholder="查找姓名（只影响明细）"><label class="check"><input id="unfinished" type="checkbox">只看未完成</label><p id="chart-filter" class="note" role="status"></p></div>
    <div class="table-box"><table class="dash-table"><thead><tr><th>姓名</th><th>当前站</th><th>1 指令哪来<br><small>目标1·重点</small></th><th>2 设备面板<br><small>目标1·重点</small></th><th>3 举牌表决<br><small>目标2·重点</small></th><th>4 真假问答<br><small>目标2·重点</small></th><th>5 取反实验<br><small>目标3·难点</small></th><th>6 投票统计器<br><small>拓展·目标1</small></th><th>证据星</th><th>误解</th><th>考核 首次/最近</th><th>最近同步</th><th>详情</th></tr></thead><tbody id="student-rows"></tbody></table></div>
    <section id="student-detail" class="teacher-detail" hidden></section>
  </section>
  <!-- 教师要求本课不用麦克风；拓展活动改为第5站“教室噪声监测器”仿真（教参：没有条件可结合虚拟仿真噪声监测系统）。保留代码不显示。 -->
</main></body></html>
